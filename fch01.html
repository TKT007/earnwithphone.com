<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#0a0c12"><title>Freecash — Get Paid For Your Screen Time</title>
<style>:root{--bg:#0a0c12;--bg2:#0e1119;--card:#141826;--card2:#171b2c;--text:#f2f5f7;--muted:#9aa3b2;--dim:#6b7382;--green:#01d676;--green-soft:rgba(1,214,118,.12);--gold:#ffc24b;--gold-soft:rgba(255,194,75,.12);--line:rgba(255,255,255,.08);}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:radial-gradient(900px 500px at 85% -10%,#131a26 0%,var(--bg) 55%);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;}#loader{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .45s ease;}#loader.gone{opacity:0;pointer-events:none;}.loader-mark{width:44px;height:40px;animation:pulse 1.1s ease-in-out infinite;}@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(.86);opacity:.6;}}.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(560px 400px at 88% -6%,rgba(1,214,118,.10),transparent 60%),radial-gradient(480px 380px at -12% 22%,rgba(255,194,75,.06),transparent 60%),radial-gradient(700px 520px at 50% 115%,rgba(1,214,118,.05),transparent 60%);}.dots-overlay{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:linear-gradient(#000 0%,transparent 55%);mask-image:linear-gradient(#000 0%,transparent 55%);}
/* ===== NAV ===== */
.nav{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto;padding:18px 20px 6px;}.brand{display:inline-flex;align-items:center;gap:8px;text-decoration:none;}.brand .mark{width:27px;height:24px;display:block;}.brand .wordmark{height:15px;width:auto;display:block;}
/* ===== LAYOUT ===== */
.main-wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:26px 20px 130px;}
/* ===== HERO ===== */
.hero{position:relative;text-align:left;}.hero-chip{display:inline-flex;align-items:center;gap:7px;background:var(--green-soft);border:1px solid rgba(1,214,118,.3);color:var(--green);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;letter-spacing:.02em;}.hero-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.8s ease-in-out infinite;}@keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}.main-heading{margin-top:16px;font-size:clamp(31px,8.4vw,42px);font-weight:800;line-height:1.1;letter-spacing:-.02em;}.main-heading .g{background:linear-gradient(92deg,#01d676 10%,#57eca2 90%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}.main-sub{margin-top:12px;font-size:15px;line-height:1.6;color:var(--muted);max-width:400px;}.hero-coins{position:absolute;pointer-events:none;}.coin-sm{top:-4px;right:26px;width:22px;height:22px;animation:float 5.5s ease-in-out infinite;}.coin-md{top:64px;right:-2px;width:15px;height:15px;animation:float 6.5s .8s ease-in-out infinite;}.coin-lg{top:-14px;right:-6px;width:34px;height:34px;animation:float 7s .4s ease-in-out infinite;}@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg);}50%{transform:translateY(-9px) rotate(8deg);}}
/* ===== COUNTER ===== */
.counter-strip{margin-top:20px;display:flex;align-items:center;gap:11px;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:12px 15px;}.counter-strip .coin-ic{flex:none;width:26px;height:26px;}.counter-strip .amt{font-size:16.5px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums;white-space:nowrap;}.counter-strip .lbl{font-size:12.5px;color:var(--muted);line-height:1.3;}.live-tag{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--green);}.live-tag i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.4s ease-in-out infinite;}
/* ===== CTA ===== */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;width:100%;padding:17px 24px;border-radius:14px;background:var(--green);color:#082015;font-size:16px;font-weight:800;letter-spacing:.01em;text-decoration:none;box-shadow:0 14px 34px rgba(1,214,118,.32);transition:transform .15s ease,filter .15s ease;}.cta:hover{filter:brightness(1.06);transform:translateY(-1px);}.cta:active{transform:scale(.985);}.cta svg{width:19px;height:19px;stroke:#082015;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}.cta-note{margin-top:11px;display:flex;align-items:center;gap:6px;justify-content:center;font-size:12.5px;color:var(--dim);font-weight:500;}.cta-note svg{width:14px;height:14px;stroke:var(--green);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
/* ===== TRUSTPILOT ===== */
.tp-row{margin-top:16px;display:flex;align-items:center;gap:8px;justify-content:center;}.tp-stars{display:inline-flex;gap:2px;}.tp-stars svg{width:16px;height:16px;}.tp-txt{font-size:12.5px;color:var(--muted);font-weight:600;}
/* ===== SECTIONS ===== */
.section{margin-top:34px;}.sec-head{display:flex;align-items:center;gap:9px;}.sec-head::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--green);}.sec-title{font-size:15.5px;font-weight:800;letter-spacing:-.01em;}.sec-sub{margin-top:4px;font-size:12.5px;color:var(--dim);font-weight:500;}
/* ===== TIMELINE STEPS ===== */
.timeline{position:relative;margin-top:18px;padding-left:42px;}.timeline::before{content:"";position:absolute;left:15px;top:30px;bottom:30px;width:2px;background:linear-gradient(180deg,var(--green),rgba(1,214,118,.12));border-radius:2px;}.timeline.single::before{display:none;}.step{position:relative;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:15px 16px;}.step + .step{margin-top:14px;}.step-node{position:absolute;left:-42px;top:13px;width:32px;height:32px;border-radius:50%;background:#0e2318;border:1px solid rgba(1,214,118,.55);display:grid;place-items:center;}.step-node svg{width:16px;height:16px;stroke:var(--green);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}.step-title{font-size:15px;font-weight:700;}.step-title .num{color:var(--green);font-weight:800;margin-right:5px;font-variant-numeric:tabular-nums;}.step-desc{margin-top:3px;font-size:13px;color:var(--muted);line-height:1.5;}
/* ===== STATS ===== */
.stats{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;overflow:hidden;}.stat{padding:15px 8px;text-align:center;}.stat + .stat{border-left:1px solid var(--line);}.stat .v{font-size:17px;font-weight:800;letter-spacing:-.01em;}.stat .v.green{color:var(--green);}.stat .v.gold{color:var(--gold);}.stat .k{margin-top:3px;font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
/* ===== PAYOUT CHIPS ===== */
.chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:9px;}.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;color:var(--text);}.chip i{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;}.chip.paypal i{background:#3b7ddd;}.chip.crypto i{background:#f7931a;}.chip.amazon i{background:#ff9900;}.chip.visa i{background:#4d68b0;}.chip.apple i{background:#e8e8ed;}.chip.gift i{background:var(--green);}
/* ===== TICKER ===== */
.ticker{margin-top:16px;overflow:hidden;background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:12px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);}.ticker-track{display:flex;gap:10px;width:max-content;animation:scroll 26s linear infinite;}.ticker:hover .ticker-track{animation-play-state:paused;}@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}.tick{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;}.tick .n{color:var(--text);}.tick .m{color:var(--dim);font-weight:500;}.tick .a{color:var(--green);font-weight:800;font-variant-numeric:tabular-nums;}
/* ===== FOOT ===== */
.foot{margin-top:30px;text-align:center;font-size:12px;color:var(--dim);line-height:1.6;}.foot .fbrand{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;opacity:.85;}.foot .fbrand .mark{width:18px;height:16px;}.foot .fbrand .wordmark{height:11px;width:auto;display:block;}
/* ===== STICKY ===== */
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:100;padding:12px 16px max(14px,env(safe-area-inset-bottom));background:rgba(10,12,18,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.07);transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.7,.3,1);}.sticky-cta.visible{transform:none;}.sticky-cta .cta{margin-top:0;box-shadow:0 -4px 24px rgba(1,214,118,.2);}</style>
